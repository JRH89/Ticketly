services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ticketly
      POSTGRES_USER: ticketly
      POSTGRES_PASSWORD: ticketly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketly -d ticketly"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketly
      SPRING_DATASOURCE_USERNAME: ticketly
      SPRING_DATASOURCE_PASSWORD: ticketly
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports: ["8081:8080"]
  web:
    build: ./frontend
    depends_on:
      api: { condition: service_healthy }
    ports: ["5174:80"]
